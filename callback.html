<!DOCTYPE html>
<html>
<head>
  <title>Nero AE Discord Auth Callback</title>
  <style>
    body { background: #0f1420; color: #ffffff; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .card { background: rgba(255,255,255,0.05); border: 1px solid rgba(88,101,242,0.4); padding: 30px; border-radius: 16px; text-align: center; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Authorization Successful!</h2>
    <p>Logging into After Effects...</p>
  </div>

  <script>
    (function() {
      // Get hash or query string containing access_token
      var hash = window.location.hash || window.location.search;
      if (hash) {
        // Replace leading # with ? for search params format
        if (hash.startsWith('#')) hash = '?' + hash.substring(1);
        
        // Send access token to AE local server port 18492
        var img = new Image();
        img.src = 'http://127.0.0.1:18492/token' + hash;
      }

      setTimeout(function() {
        window.close();
      }, 1000);
    })();
  </script>
</body>
</html>
