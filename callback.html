<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Nero AE Discord Auth Callback</title>
  <style>
    body { background: #0f1420; color: #ffffff; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .card { background: rgba(255,255,255,0.05); border: 1px solid rgba(88,101,242,0.4); padding: 30px; border-radius: 16px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    h2 { color: #5865F2; margin-bottom: 8px; }
    p { color: #94a3b8; font-size: 14px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Authorization Successful!</h2>
    <p>Syncing profile to Nero After Effects...</p>
  </div>

  <script>
    (function() {
      var hash = window.location.hash.substring(1);
      var params = new URLSearchParams(hash);
      var token = params.get('access_token');
      var queryCode = new URLSearchParams(window.location.search).get('code');
      var finalToken = token || queryCode;

      if (finalToken) {
        // Method 1: Fetch CORS request
        fetch('http://localhost:18492/token?access_token=' + encodeURIComponent(finalToken), { mode: 'no-cors' }).catch(function(e){});
        
        // Method 2: Image Beacon Ping (Bypasses CORS browser restrictions completely)
        var img = new Image();
        img.src = 'http://localhost:18492/token?access_token=' + encodeURIComponent(finalToken);
      }

      setTimeout(function() {
        window.location.href = 'https://discord.gg/vuhVcsA7R';
      }, 1200);
    })();
  </script>
</body>
</html>
