<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Nero Discord Auth</title>
  <style>
    body {
      background: #0e121b;
      color: #ffffff;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: #181c28;
      border: 1px solid rgba(88, 101, 242, 0.4);
      border-radius: 16px;
      padding: 30px 40px;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }
    h2 { color: #5865F2; margin-bottom: 8px; }
    p { color: #94a3b8; font-size: 14px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Discord Connected Successfully!</h2>
    <p>Syncing profile to Nero Extension in After Effects...</p>
  </div>

  <script>
    var hash = window.location.hash.substring(1);
    var params = new URLSearchParams(hash);
    var token = params.get('access_token');
    var code = new URLSearchParams(window.location.search).get('code');

    // 1. If opened in popup inside browser
    if (token && window.opener) {
      try { window.opener.postMessage({ type: 'NERO_DISCORD_TOKEN', token: token }, '*'); } catch(e) {}
    }

    // 2. Ping local Nero extension server running on localhost:18492 inside After Effects
    if (token) {
      fetch('http://localhost:18492/token?access_token=' + token)
        .catch(function(err) { console.log('Local server ping done'); });
    } else if (code) {
      fetch('http://localhost:18492/token?code=' + code)
        .catch(function(err) { console.log('Local server ping done'); });
    }

    // Automatically close tab after 1.2s
    setTimeout(function() {
      try { window.close(); } catch(e) {}
    }, 1200);
  </script>
</body>
</html>
